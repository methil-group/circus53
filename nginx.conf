events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Active la compression gzip (Unity WebGL utilise la compression par défaut)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/octet-stream
        application/wasm
        text/css
        text/html
        text/plain;

    server {
        listen 80;

        # En-têtes requis pour SharedArrayBuffer (threading WebGL)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # MIME type pour les fichiers WASM
        location ~* \.wasm$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/wasm;
        }

        # Cache pour les assets statiques compressés
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|data|mem)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
